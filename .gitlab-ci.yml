image: node:lts

build:
  stage: build
  cache:
    paths:
      - $CI_PROJECT_DIR/*
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - build

test:
  stage: test
  cache:
    paths:
      - $CI_PROJECT_DIR/*
    policy: pull
  script:
    - npm start

pages:
  stage: deploy
  dependencies: 
    - build
  script:
    - rm -rf public
    - cp build/index.html build/404.html
    - mv build public
  artifacts:
    paths:
      - $CI_PROJECT_DIR/*
  only:
    - main